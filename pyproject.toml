[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-automation-runtime"
dynamic = ["version"]
description = "Proprietary runtime for the Otostogan platform automation contract"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Otostogan" }]
dependencies = [
    "jsonschema>=4.18,<5",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
operator = [
    "questionary>=2,<3",
]
dev = [
    "black==24.8.0",
    "build>=1.2,<2",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
platform = "platform_automation.platform_cli:main"
platform-acme-readiness = "platform_automation.acme_readiness:main"
platform-build-bundle = "platform_automation.build_bundle:main"
platform-nginx-reconcile = "platform_automation.nginx_reconcile:main"
platform-prepare-bundle = "platform_automation.bundle_action:main"
platform-reboot-recovery = "platform_automation.reboot_recovery_entrypoint:main"
platform-validate-manifest = "platform_automation.validate_manifest:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "platform_automation.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"platform_automation.contracts" = ["*.json"]
"platform_automation.templates" = ["app/*"]

[tool.black]
line-length = 88
target-version = ["py39"]
