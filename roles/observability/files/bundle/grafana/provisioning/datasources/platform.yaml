apiVersion: 1

# Fixed UIDs: the dashboards refer to them, and a rebuilt Grafana must find
# the same sources under the same names.
datasources:
    - name: Prometheus
      uid: platform-prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
    - name: Loki
      uid: platform-loki
      type: loki
      access: proxy
      url: http://loki:3100
      editable: false
