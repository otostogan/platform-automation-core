apiVersion: 1

# Dashboards are files in the collection. What is clicked together in the UI
# does not survive convergence, on purpose.
providers:
    - name: platform
      folder: Platform
      type: file
      disableDeletion: true
      allowUiUpdates: false
      updateIntervalSeconds: 60
      options:
          path: /etc/grafana/dashboards
    # Dashboards an application ships in its release. One directory per
    # application and environment, shown as a folder of that name; a dashboard
    # leaves with the release that brought it.
    - name: applications
      type: file
      disableDeletion: false
      allowUiUpdates: false
      updateIntervalSeconds: 30
      options:
          path: /etc/grafana/application-dashboards
          foldersFromFilesStructure: true
