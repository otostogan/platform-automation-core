---
- name: Update APT package cache
  ansible.builtin.apt:
      update_cache: true
      cache_valid_time: "{{ common_apt_cache_valid_time }}"

- name: Install common system packages
  ansible.builtin.apt:
      name: "{{ common_packages }}"
      state: present

- name: Configure timezone file
  ansible.builtin.copy:
      content: "{{ common_timezone }}\n"
      dest: /etc/timezone
      owner: root
      group: root
      mode: "0644"

- name: Configure localtime
  ansible.builtin.file:
      src: "/usr/share/zoneinfo/{{ common_timezone }}"
      dest: /etc/localtime
      state: link
      force: true

- name: Enable system time synchronization
  ansible.builtin.systemd_service:
      name: systemd-timesyncd.service
      enabled: true
      state: started

- name: Configure automatic security updates
  ansible.builtin.copy:
      content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
      dest: /etc/apt/apt.conf.d/20auto-upgrades
      owner: root
      group: root
      mode: "0644"

- name: Configure unattended upgrade policy
  ansible.builtin.copy:
      content: |
          // Managed by Ansible
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "{{ common_unattended_upgrades_remove_unused_kernel_packages | ternary('true', 'false') }}";
          Unattended-Upgrade::Remove-New-Unused-Dependencies "{{ common_unattended_upgrades_remove_unused_dependencies | ternary('true', 'false') }}";
          Unattended-Upgrade::Remove-Unused-Dependencies "{{ common_unattended_upgrades_remove_unused_dependencies | ternary('true', 'false') }}";
          Unattended-Upgrade::Automatic-Reboot "{{ common_unattended_upgrades_automatic_reboot | ternary('true', 'false') }}";
          Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
      dest: /etc/apt/apt.conf.d/52platform-unattended-upgrades
      owner: root
      group: root
      mode: "0644"

- name: Validate APT configuration
  ansible.builtin.command:
      argv:
          - /usr/bin/apt-config
          - dump
  changed_when: false

- name: Enable unattended upgrades
  ansible.builtin.systemd_service:
      name: unattended-upgrades.service
      enabled: true
      state: started

- name: Enable automatic update timers
  ansible.builtin.systemd_service:
      name: "{{ item }}"
      enabled: true
      state: started
  loop:
      - apt-daily.timer
      - apt-daily-upgrade.timer
