---
- name: Validate platform CLI SOPS recipient policy
  ansible.builtin.assert:
      that:
          - platform_cli_minimum_age_recipients is integer
          - platform_cli_minimum_age_recipients >= 1
      fail_msg: >-
          platform_cli_minimum_age_recipients must be a positive integer

- name: Install platform CLI runtime packages
  ansible.builtin.apt:
      name: "{{ platform_cli_runtime_packages }}"
      state: present
      update_cache: true
      cache_valid_time: 3600

- name: Create platform CLI directories
  ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      owner: root
      group: root
      mode: "0755"
  loop:
      - "{{ platform_cli_install_root }}"
      - "{{ platform_cli_install_root }}/{{ platform_cli_python_package }}"
      - >-
          {{ platform_cli_install_root }}/{{ platform_cli_python_package }}/contracts

- name: Install platform CLI Python modules
  ansible.builtin.copy:
      src: "{{ role_path }}/../../src/platform_automation/{{ item }}"
      dest: >-
          {{ platform_cli_install_root }}/{{ platform_cli_python_package }}/{{ item }}
      owner: root
      group: root
      mode: "0644"
  loop: "{{ platform_cli_tool_files }}"

- name: Install platform CLI contracts
  ansible.builtin.copy:
      src: "{{ role_path }}/../../src/platform_automation/contracts/{{ item }}"
      dest: >-
          {{ platform_cli_install_root }}/{{ platform_cli_python_package }}/contracts/{{ item }}
      owner: root
      group: root
      mode: "0644"
  loop: "{{ platform_cli_contract_files }}"

- name: Install raw Nginx project allowlist
  ansible.builtin.copy:
      content: "{{ platform_cli_nginx_raw_projects | sort | unique | to_nice_json }}\n"
      dest: "{{ platform_cli_nginx_raw_allowlist_file }}"
      owner: root
      group: root
      mode: "0600"

- name: Install platform CLI executable
  ansible.builtin.template:
      src: platform.j2
      dest: "{{ platform_cli_executable }}"
      owner: root
      group: root
      mode: "0755"

- name: Validate offsite backup settings
  ansible.builtin.assert:
      that:
          - platform_cli_offsite_bucket | length > 0
          - platform_cli_offsite_region | length > 0
          - platform_cli_offsite_prefix | length > 0
          - platform_cli_offsite_credentials_source | length > 0
      fail_msg: >-
          platform_cli_offsite_enabled requires bucket, region and prefix in inventory,
          and platform_cli_offsite_credentials_source in the ignored local-secrets.yml
  when: platform_cli_offsite_enabled | bool

# Not secret: this is a description of where backups go, and it belongs in
# the inventory rather than beside the credential.
- name: Install offsite backup configuration
  ansible.builtin.copy:
      content: "{{ platform_cli_offsite_settings | to_nice_json }}\n"
      dest: "{{ platform_cli_offsite_config }}"
      owner: root
      group: root
      mode: "0644"
  vars:
      platform_cli_offsite_settings:
          enabled: "{{ platform_cli_offsite_enabled | bool }}"
          endpoint: "{{ platform_cli_offsite_endpoint }}"
          region: "{{ platform_cli_offsite_region }}"
          bucket: "{{ platform_cli_offsite_bucket }}"
          prefix: "{{ platform_cli_offsite_prefix }}"

# The host holds a write-only credential on purpose: it can add backups and
# neither read the history back nor remove any of it. Reading is an operator
# action with an operator key.
- name: Install offsite backup credentials
  ansible.builtin.copy:
      src: "{{ platform_cli_offsite_credentials_source }}"
      dest: "{{ platform_cli_offsite_credentials }}"
      owner: root
      group: root
      mode: "0600"
  no_log: true
  when: platform_cli_offsite_enabled | bool

- name: Remove offsite backup credentials when disabled
  ansible.builtin.file:
      path: "{{ platform_cli_offsite_credentials }}"
      state: absent
  when: not (platform_cli_offsite_enabled | bool)

# The units are installed by convergence, not written by a deploy: what runs
# and as whom is fixed by the operator, and a deploy only supplies the cadence.
- name: Install scheduled backup units
  ansible.builtin.template:
      src: "{{ item }}.j2"
      dest: "/etc/systemd/system/{{ item }}"
      owner: root
      group: root
      mode: "0644"
  loop:
      - platform-backup@.service
      - platform-backup@.timer
  notify: Reload systemd after installing backup units

- name: Validate installed platform CLI
  ansible.builtin.command:
      cmd: "{{ platform_cli_executable }} --help"
  changed_when: false
