---
- name: Validate ACME configuration
  ansible.builtin.assert:
      that:
          - not proxy_acme_enabled or proxy_acme_email != "ops@example.invalid"
          - not proxy_acme_enabled or "@" in proxy_acme_email
          - not proxy_acme_enabled or proxy_acme_ca_uri is match("^https://")
      fail_msg: >-
          ACME requires a real contact email and an HTTPS ACME directory URI.

- name: Create proxy installation directories
  ansible.builtin.file:
      path: "{{ proxy_install_directory }}/{{ item }}"
      state: directory
      owner: root
      group: root
      mode: "0755"
  loop: "{{ proxy_bundle_directories }}"

- name: Create proxy state root
  ansible.builtin.file:
      path: "{{ proxy_state_directory }}"
      state: directory
      owner: root
      group: root
      mode: "0755"

- name: Create proxy state directories
  ansible.builtin.file:
      path: "{{ proxy_state_directory }}/{{ item }}"
      state: directory
      owner: root
      group: root
      mode: "0755"
  loop: "{{ proxy_state_directories }}"

- name: Create private managed Nginx ownership directory
  ansible.builtin.file:
      path: "{{ proxy_state_directory }}/managed-vhosts"
      state: directory
      owner: root
      group: root
      mode: "0700"

- name: Install static Nginx configuration
  ansible.builtin.copy:
      src: "{{ proxy_bundle_source }}/conf.d/00-security.conf"
      dest: "{{ proxy_state_directory }}/conf.d/00-security.conf"
      owner: root
      group: root
      mode: "0644"
  notify: Restart platform proxy

- name: Inspect platform edge network
  ansible.builtin.command:
      argv:
          - /usr/bin/docker
          - network
          - inspect
          - "{{ proxy_edge_network }}"
  register: proxy_edge_network_inspect
  changed_when: false
  failed_when: false

- name: Create platform edge network
  ansible.builtin.command:
      argv:
          - /usr/bin/docker
          - network
          - create
          - --driver
          - bridge
          - "{{ proxy_edge_network }}"
  when: proxy_edge_network_inspect.rc != 0
  changed_when: true

- name: Install proxy bundle files
  ansible.builtin.copy:
      src: "{{ proxy_bundle_source }}/{{ item }}"
      dest: "{{ proxy_install_directory }}/{{ item }}"
      owner: root
      group: root
      mode: "0644"
  loop: "{{ proxy_bundle_files }}"
  notify: Restart platform proxy

- name: Install proxy environment
  ansible.builtin.template:
      src: proxy.env.j2
      dest: "{{ proxy_environment_file }}"
      owner: root
      group: root
      mode: "0600"
  notify: Restart platform proxy

- name: Validate installed proxy Compose
  ansible.builtin.command:
      argv:
          - /usr/bin/docker
          - compose
          - --env-file
          - "{{ proxy_environment_file }}"
          - --file
          - "{{ proxy_install_directory }}/compose.yml"
          - config
          - --quiet
  changed_when: false

- name: Install platform proxy service
  ansible.builtin.template:
      src: platform-proxy.service.j2
      dest: /etc/systemd/system/platform-proxy.service
      owner: root
      group: root
      mode: "0644"
  notify: Restart platform proxy

- name: Enable platform proxy service
  ansible.builtin.systemd_service:
      name: platform-proxy.service
      enabled: true
      state: started
      daemon_reload: true

- name: Install Nginx reconciliation units
  ansible.builtin.template:
      src: "{{ item }}.j2"
      dest: "/etc/systemd/system/{{ item }}"
      owner: root
      group: root
      mode: "0644"
  loop:
      - platform-nginx-reconcile.service
      - platform-nginx-reconcile.timer

- name: Enable Nginx reconciliation timer
  ansible.builtin.systemd_service:
      name: platform-nginx-reconcile.timer
      enabled: true
      state: started
      daemon_reload: true
