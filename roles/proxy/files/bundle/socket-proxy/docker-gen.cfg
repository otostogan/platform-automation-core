global
    log stdout format raw daemon "${LOG_LEVEL}"
    pidfile /run/haproxy.pid
    maxconn 1000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s

backend dockerbackend
    server dockersocket $SOCKET_PATH

backend docker-events
    server dockersocket $SOCKET_PATH
    timeout server 0

frontend dockerfrontend
    bind ${BIND_CONFIG}

    acl read_method method GET HEAD

    acl system_path path_reg -i ^(/v[0-9.]+)?/(_ping|version|info)$
    acl events_path path_reg -i ^(/v[0-9.]+)?/events$
    acl containers_path path_reg -i ^(/v[0-9.]+)?/containers/json$
    acl container_inspect_path path_reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/json$
    acl networks_path path_reg -i ^(/v[0-9.]+)?/networks$
    acl network_inspect_path path_reg -i ^(/v[0-9.]+)?/networks/[a-zA-Z0-9_.:-]+$

    http-request allow if read_method system_path
    http-request allow if read_method events_path
    http-request allow if read_method containers_path
    http-request allow if read_method container_inspect_path
    http-request allow if read_method networks_path
    http-request allow if read_method network_inspect_path
    http-request deny

    default_backend dockerbackend
    use_backend docker-events if read_method events_path
