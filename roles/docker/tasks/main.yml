---
- name: Validate Docker architecture
  ansible.builtin.assert:
      that:
          - ansible_architecture in docker_apt_architectures
      fail_msg: "Unsupported Docker architecture: {{ ansible_architecture }}"

- name: Gather installed package facts
  ansible.builtin.package_facts:
      manager: auto

- name: Remove conflicting Docker packages
  ansible.builtin.apt:
      name: >-
          {{
            docker_conflicting_packages
            | intersect(ansible_facts.packages.keys() | list)
          }}
      state: absent
  when:
      - docker_conflicting_packages
        | intersect(ansible_facts.packages.keys() | list)
        | length > 0

- name: Create APT keyring directory
  ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      owner: root
      group: root
      mode: "0755"

- name: Install Docker repository signing key
  ansible.builtin.get_url:
      url: https://download.docker.com/linux/ubuntu/gpg
      dest: /etc/apt/keyrings/docker.asc
      owner: root
      group: root
      mode: "0644"
  register: docker_repository_key

- name: Configure Docker APT repository
  ansible.builtin.copy:
      content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Architectures: {{ docker_apt_architectures[ansible_architecture] }}
          Signed-By: /etc/apt/keyrings/docker.asc
      dest: /etc/apt/sources.list.d/docker.sources
      owner: root
      group: root
      mode: "0644"
  register: docker_repository

- name: Probe Docker repository package metadata
  ansible.builtin.command:
      argv:
          - /usr/bin/apt-cache
          - show
          - containerd.io
  check_mode: false
  changed_when: false
  failed_when: false
  register: docker_repository_metadata

- name: Update APT cache after adding Docker repository
  ansible.builtin.apt:
      update_cache: true
  # Refreshing the package index is a precondition, not a change to the
  # host. See roles/common/tasks/main.yml.
  changed_when: false
  when:
      - >-
          docker_repository_key.changed
          or docker_repository.changed
          or docker_repository_metadata.rc != 0

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
      name: "{{ docker_packages }}"
      state: present

- name: Create Docker configuration directory
  ansible.builtin.file:
      path: /etc/docker
      state: directory
      owner: root
      group: root
      mode: "0755"

- name: Configure Docker daemon
  ansible.builtin.copy:
      content: |
          {
            "firewall-backend": "iptables",
            "iptables": true,
            "live-restore": true,
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "{{ docker_log_max_size }}",
              "max-file": "{{ docker_log_max_file }}"
            }
          }
      dest: /etc/docker/daemon.json
      owner: root
      group: root
      mode: "0644"
      validate: /usr/bin/dockerd --validate --config-file=%s
  notify: Restart Docker

- name: Enable Docker services
  ansible.builtin.systemd_service:
      name: "{{ item }}"
      enabled: true
      state: started
  loop:
      - containerd.service
      - docker.service

- name: Install lazydocker
  ansible.builtin.include_tasks: lazydocker.yml
  when: docker_install_lazydocker
