---
- name: Validate supported SOPS architecture
  ansible.builtin.assert:
      that:
          - ansible_architecture in secrets_sops_architectures
      fail_msg: >-
          Unsupported architecture for SOPS:
          {{ ansible_architecture }}

- name: Resolve SOPS architecture
  ansible.builtin.set_fact:
      secrets_sops_architecture: >-
          {{ secrets_sops_architectures[ansible_architecture] }}

- name: Validate local age key source
  ansible.builtin.assert:
      that:
          - secrets_age_key_source | length > 0
      fail_msg: >-
          Set secrets_age_key_source in the ignored
          inventory local-secrets.yml file.

- name: Install pinned SOPS binary
  ansible.builtin.get_url:
      url: >-
          https://github.com/getsops/sops/releases/download/v{{ secrets_sops_version }}/sops-v{{ secrets_sops_version }}.linux.{{ secrets_sops_architecture }}
      dest: "{{ secrets_sops_install_path }}"
      owner: root
      group: root
      mode: "0755"
      checksum: >-
          sha256:{{ secrets_sops_checksums[secrets_sops_architecture] }}

- name: Inspect installed age binary
  ansible.builtin.command:
      cmd: "{{ secrets_age_install_path }} --version"
  register: secrets_age_installed
  changed_when: false
  failed_when: false

# age ships as an archive, and unarchive cannot verify a checksum. Fetching
# and verifying first means nothing is ever extracted unverified. The whole
# block is skipped once the pinned version is in place, so a converged host
# reports no change.
- name: Install pinned age binary
  when: >-
      secrets_age_installed.rc != 0
      or secrets_age_installed.stdout | trim != 'v' ~ secrets_age_version
  block:
      - name: Fetch pinned age archive
        ansible.builtin.get_url:
            url: >-
                https://github.com/FiloSottile/age/releases/download/v{{
                secrets_age_version }}/age-v{{ secrets_age_version }}-linux-{{
                secrets_sops_architecture }}.tar.gz
            dest: "{{ secrets_age_archive_path }}"
            owner: root
            group: root
            mode: "0600"
            checksum: >-
                sha256:{{ secrets_age_checksums[secrets_sops_architecture] }}

      - name: Extract the pinned age binary
        ansible.builtin.unarchive:
            src: "{{ secrets_age_archive_path }}"
            dest: /usr/local/bin
            remote_src: true
            extra_opts:
                - --strip-components=1
                - age/age
            owner: root
            group: root
            mode: "0755"
  always:
      - name: Remove the age archive
        ansible.builtin.file:
            path: "{{ secrets_age_archive_path }}"
            state: absent

- name: Create platform key directory
  ansible.builtin.file:
      path: "{{ secrets_age_key_destination | dirname }}"
      state: directory
      owner: root
      group: root
      mode: "0700"

- name: Install environment age private key
  ansible.builtin.copy:
      src: "{{ secrets_age_key_source }}"
      dest: "{{ secrets_age_key_destination }}"
      owner: root
      group: root
      mode: "0600"
  no_log: true

- name: Validate installed SOPS binary
  ansible.builtin.command:
      cmd: "{{ secrets_sops_install_path }} --version"
  changed_when: false

- name: Validate installed age binary
  ansible.builtin.command:
      cmd: "{{ secrets_age_install_path }} --version"
  changed_when: false
