---
- name: Create persistent platform directories
  ansible.builtin.file:
      path: "{{ item.path }}"
      state: directory
      owner: root
      group: root
      mode: "{{ item.mode }}"
  loop: "{{ platform_base_directories }}"
  loop_control:
      label: "{{ item.path }}"

- name: Create runtime platform directories
  ansible.builtin.file:
      path: "{{ item.path }}"
      state: directory
      owner: root
      group: root
      mode: "{{ item.mode }}"
  loop: "{{ platform_base_runtime_directories }}"
  loop_control:
      label: "{{ item.path }}"

- name: Install platform tmpfiles configuration
  ansible.builtin.template:
      src: platform.conf.j2
      dest: /etc/tmpfiles.d/platform.conf
      owner: root
      group: root
      mode: "0644"

- name: Apply platform tmpfiles configuration
  ansible.builtin.command:
      argv:
          - /usr/bin/systemd-tmpfiles
          - --create
          - /etc/tmpfiles.d/platform.conf
  changed_when: false

- name: Create journald configuration directory
  ansible.builtin.file:
      path: /etc/systemd/journald.conf.d
      state: directory
      owner: root
      group: root
      mode: "0755"

- name: Create persistent journal directory
  ansible.builtin.file:
      path: /var/log/journal
      state: directory
      owner: root
      group: systemd-journal
      mode: "2755"
  notify: Restart systemd-journald

- name: Configure persistent system journal
  ansible.builtin.template:
      src: journald.conf.j2
      dest: /etc/systemd/journald.conf.d/platform.conf
      owner: root
      group: root
      mode: "0644"
  notify: Restart systemd-journald

- name: Configure platform log rotation
  ansible.builtin.template:
      src: logrotate.conf.j2
      dest: /etc/logrotate.d/platform
      owner: root
      group: root
      mode: "0644"
      validate: /usr/sbin/logrotate --debug %s
