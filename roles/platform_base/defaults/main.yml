---
platform_base_directories:
    - path: /opt/platform
      mode: "0755"
    - path: /opt/platform/bin
      mode: "0755"
    - path: /etc/platform
      mode: "0755"
    - path: /etc/platform/keys
      mode: "0700"
    - path: /var/lib/platform
      mode: "0750"
    - path: /var/lib/platform/projects
      mode: "0750"
    - path: /var/lib/platform/releases
      mode: "0750"
    - path: /var/lib/platform/databases
      mode: "0750"
    - path: /var/log/platform
      mode: "0750"
    - path: /var/backups/platform
      mode: "0700"

platform_base_runtime_directories:
    - path: /run/platform
      mode: "0700"
    - path: /run/platform/secrets
      mode: "0700"
    - path: /run/platform/locks
      mode: "0700"

platform_base_journal_system_max_use: 1G
platform_base_journal_runtime_max_use: 256M
platform_base_journal_max_retention: 14day

platform_base_logrotate_retention: 14
