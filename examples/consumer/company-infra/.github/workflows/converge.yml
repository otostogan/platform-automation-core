---
name: Converge platform hosts

on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    converge:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
              with:
                  python-version: "3.9"

            - name: Install pinned controller runtime
              run: python -m pip install ansible-core==2.15.13

            - name: Download immutable core collection
              env:
                  GH_TOKEN: ${{ secrets.PLATFORM_CORE_TOKEN }}
              run: >-
                  gh release download v0.15.0
                  --repo otostogan/platform-automation-core
                  --pattern otostogan-platform-0.15.0.tar.gz
                  --pattern SHA256SUMS
                  --dir "${RUNNER_TEMP}/platform-core"

            - name: Verify and install automation
              run: |
                  cd "${RUNNER_TEMP}/platform-core"
                  sha256sum --check --ignore-missing SHA256SUMS
                  ansible-galaxy collection install \
                      otostogan-platform-0.15.0.tar.gz
                  cd "${GITHUB_WORKSPACE}"
                  ansible-galaxy collection install --requirement requirements.yml

            - name: Connect to the private administration network
              uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  audience: ${{ secrets.TS_AUDIENCE }}
                  tags: ${{ vars.PLATFORM_CI_TAILSCALE_TAG }}

            - name: Materialize controller-only age identity
              env:
                  PLATFORM_AGE_KEY: ${{ secrets.PLATFORM_AGE_KEY }}
              run: |
                  umask 077
                  test -n "${PLATFORM_AGE_KEY}"
                  printf '%s\n' "${PLATFORM_AGE_KEY}" > "${RUNNER_TEMP}/platform.agekey"

            - name: Converge platform hosts
              env:
                  ANSIBLE_CONFIG: ansible.cfg
              run: >-
                  ansible-playbook otostogan.platform.converge
                  --inventory inventory/hosts.yml
                  --extra-vars secrets_age_key_source=${RUNNER_TEMP}/platform.agekey
