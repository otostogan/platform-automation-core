---
# The real path is controller-local and must never be committed with key data.
secrets_age_key_source: /secure/controller/staging.agekey

# Prefer a short-lived, one-off, pre-authorized key issued for the company tag.
# The role copies it transiently, enrolls the host, and deletes the remote copy.
tailscale_auth_key_source: /secure/controller/tailscale-auth.key
