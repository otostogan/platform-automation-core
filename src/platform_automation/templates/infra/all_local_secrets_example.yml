---
# Copy to local-secrets.yml (git-ignored). Paths only — key material never
# enters this repository, in any form, including examples.
#
# Short-lived, one-off, pre-authorized Tailscale key issued for the server tag.
# Overwritten before each bootstrap; shared on purpose.
tailscale_auth_key_source: ~/.config/platform-keys/<org>/tailscale-auth.key
