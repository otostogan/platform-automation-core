---
# Controller-local path to the age identity for THIS host. The key is
# installed at /etc/platform/keys/age.key and decrypts every application
# secret deployed here.
#
# Per host on purpose: a second host must get its own identity, or it can
# decrypt this one's secrets. A host without this file fails the secrets
# role assertion loudly rather than silently inheriting a key.
secrets_age_key_source: {{keydir}}/{{host}}.agekey

# Controller-local path to the Grafana administrator password for THIS host.
# Read only when observability_enabled is true; the file is generated with the
# host so that switching observability on is one line in the inventory.
observability_grafana_admin_password_source: {{keydir}}/{{host}}-grafana.password
