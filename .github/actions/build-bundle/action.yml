---
name: Prepare platform deployment bundle
description: Validate platform/v1 and build an encrypted deployment bundle

inputs:
    manifest-path:
        description: Path to the application platform/v1 manifest
        required: true
    core-version:
        description: Private platform core release tag
        required: false
        default: v0.3.3
    github-token:
        description: >-
            Optional token for reading core releases. The core repository is
            public, so this is only needed for a private fork.
        required: false
        default: ""
    runtime-wheel:
        description: Optional pre-downloaded runtime wheel for CI or air-gapped use
        required: false
        default: ""
    minimum-age-recipients:
        description: Minimum number of unique SOPS age recipients
        required: false
        default: "1"

outputs:
    bundle_path:
        description: Absolute path to the generated deployment bundle
        value: ${{ steps.prepare.outputs.bundle_path }}
    bundle_digest:
        description: SHA-256 digest of the generated bundle
        value: ${{ steps.prepare.outputs.bundle_digest }}
    project:
        description: Validated application project name
        value: ${{ steps.prepare.outputs.project }}
    environment:
        description: Validated deployment environment
        value: ${{ steps.prepare.outputs.environment }}
    healthcheck_host:
        description: First validated virtual host
        value: ${{ steps.prepare.outputs.healthcheck_host }}
    healthcheck_path:
        description: Validated application healthcheck path
        value: ${{ steps.prepare.outputs.healthcheck_path }}

runs:
    using: composite
    steps:
        - name: Set up Python
          uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
          with:
              python-version: "3.12"

        - name: Install versioned platform runtime wheel
          shell: bash
          env:
              CORE_VERSION: ${{ inputs.core-version }}
              # The core is public; the workflow-provided token reads it.
              GH_TOKEN: ${{ inputs.github-token || github.token }}
              RUNTIME_WHEEL: ${{ inputs.runtime-wheel }}
          run: |
              wheel_path="${RUNTIME_WHEEL}"

              if [[ -z "${wheel_path}" ]]; then
                  if [[ ! "${CORE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "core-version must be an immutable semantic release tag" >&2
                      exit 1
                  fi

                  release_directory="${RUNNER_TEMP}/platform-core-${CORE_VERSION}"
                  mkdir -p "${release_directory}"
                  gh release download "${CORE_VERSION}" \
                      --repo otostogan/platform-automation-core \
                      --pattern 'platform_automation_runtime-*.whl' \
                      --pattern SHA256SUMS \
                      --dir "${release_directory}"

                  (
                      cd "${release_directory}"
                      sha256sum --check --ignore-missing SHA256SUMS
                  )

                  mapfile -t wheels < <(
                      find "${release_directory}" \
                          -maxdepth 1 \
                          -type f \
                          -name 'platform_automation_runtime-*.whl'
                  )

                  if [[ "${#wheels[@]}" -ne 1 ]]; then
                      echo "release must contain exactly one runtime wheel" >&2
                      exit 1
                  fi

                  wheel_path="${wheels[0]}"
              fi

              test -f "${wheel_path}"
              python -m pip install --disable-pip-version-check "${wheel_path}"

        - name: Validate contract and build bundle
          id: prepare
          shell: bash
          env:
              MANIFEST_PATH: ${{ inputs.manifest-path }}
              MINIMUM_AGE_RECIPIENTS: ${{ inputs.minimum-age-recipients }}
          run: |
              output_path="${RUNNER_TEMP}/platform-deployment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle.tar.gz"

              platform-prepare-bundle \
                  --manifest "${MANIFEST_PATH}" \
                  --output "${output_path}" \
                  --github-output "${GITHUB_OUTPUT}" \
                  --minimum-age-recipients "${MINIMUM_AGE_RECIPIENTS}"

              test -s "${output_path}"
