---
name: Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        steps:
            - name: Check out tagged source
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
              with:
                  python-version: "3.9"
                  cache: pip

            - name: Install pinned release toolchain
              run: >-
                  python -m pip install
                  '.[dev]'
                  ansible-core==2.15.13
                  ansible-lint==6.22.2

            - name: Validate tag and package versions
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: python -m scripts.release_plan

            - name: Re-run release acceptance
              run: |
                  python -m black --check src tests scripts
                  python -m unittest discover -s tests -p 'test_*.py'
                  ansible-lint playbooks roles
                  python tests/integration/nginx_activation.py

            - name: Build installable artifacts
              run: |
                  python -m build --wheel
                  ansible-galaxy collection build --output-path dist

            - name: Scan and checksum artifacts
              env:
                  CORE_FORBIDDEN_MARKERS: ${{ secrets.CORE_FORBIDDEN_MARKERS }}
              run: |
                  python -m scripts.check_release_artifacts \
                    "dist/platform_automation_runtime-${RELEASE_VERSION}-py3-none-any.whl" \
                    "dist/otostogan-platform-${RELEASE_VERSION}.tar.gz"
                  cd dist
                  sha256sum \
                    "platform_automation_runtime-${RELEASE_VERSION}-py3-none-any.whl" \
                    "otostogan-platform-${RELEASE_VERSION}.tar.gz" \
                    > SHA256SUMS
                  sha256sum --check SHA256SUMS

            - name: Publish private GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${GITHUB_REF_NAME}" \
                    "dist/platform_automation_runtime-${RELEASE_VERSION}-py3-none-any.whl" \
                    "dist/otostogan-platform-${RELEASE_VERSION}.tar.gz" \
                    dist/SHA256SUMS \
                    --repo "${GITHUB_REPOSITORY}" \
                    --title "Platform Automation Core ${GITHUB_REF_NAME}" \
                    --notes-file "docs/releases/v${RELEASE_VERSION}.md" \
                    --verify-tag \
                    --latest
